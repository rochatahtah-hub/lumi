name: Build e Deploy LUMI → Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Lint (opcional, remover se não quiser)
      - name: Verificar código (lint)
        run: npm run lint --if-present
        continue-on-error: true

      # 5. Build de produção
      - name: Build para produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      # 6. Preparar pasta dist para deploy
      - name: Listar arquivos de build
        run: ls -lah dist/ | head -20

      # 7. Upload para GitHub Release (artefato de build)
      - name: 📦 Criar Release com build
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          files: |
            dist/**/*
            .htaccess
            .env.production.example
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 8. Deploy FTP para Hostinger (Python)
      - name: 🚀 Deploy para Hostinger (FTP)
        if: success()
        run: |
          python3 << 'EOF'
          import ftplib
          import os
          from pathlib import Path

          ftp_host = "${{ secrets.HOSTINGER_SERVER }}"
          ftp_user = "${{ secrets.HOSTINGER_USER }}"
          ftp_pass = "${{ secrets.HOSTINGER_PASS }}"
          remote_path = "${{ secrets.HOSTINGER_PATH }}"

          print(f"🔌 Conectando a {ftp_host}...")
          ftp = ftplib.FTP(ftp_host)
          ftp.login(ftp_user, ftp_pass)
          print("✅ Conectado!")

          # Navegar para pasta remota
          ftp.cwd(remote_path)
          print(f"📁 Acessando {remote_path}")

          # Upload dos arquivos
          dist_path = Path("dist")
          uploaded = 0
          for root, dirs, files in os.walk(dist_path):
            for file in files:
              local = Path(root) / file
              remote = str(local.relative_to(dist_path)).replace("\\", "/")
              try:
                with open(local, 'rb') as f:
                  ftp.storbinary(f'STOR {remote}', f)
                  uploaded += 1
                  print(f"✓ {remote}")
              except Exception as e:
                print(f"✗ {remote}: {e}")

          ftp.quit()
          print(f"\n✅ Deploy concluído! {uploaded} arquivos enviados.")
          EOF
        continue-on-error: false

      # 11. Notificação de sucesso
      - name: ✅ Deploy bem-sucedido!
        if: success()
        run: |
          echo "🚀 LUMI foi atualizado com sucesso!"
          echo "📍 Verifique em: https://${{ secrets.HOSTINGER_DOMAIN }}"

      # 12. Notificação de erro
      - name: ❌ Erro no deploy
        if: failure()
        run: |
          echo "⚠️ Houve um erro durante o deploy."
          echo "🔗 Verifique os logs acima e as configurações de secrets."
