name: Build e Deploy LUMI → Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Lint (opcional, remover se não quiser)
      - name: Verificar código (lint)
        run: npm run lint --if-present
        continue-on-error: true

      # 5. Build de produção
      - name: Build para produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      # 6. Preparar pasta dist para deploy
      - name: Listar arquivos de build
        run: ls -lah dist/ | head -20

      # 7. Deploy via SFTP para Hostinger
      - name: Deploy para Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: '2222'
          local_path: './dist/*'
          remote_path: ${{ secrets.HOSTINGER_DEPLOY_PATH || '/public_html' }}
          delete: 'true'

      # 8. Deploy de arquivo .env (variáveis de produção)
      - name: Deploy .env para Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          local_path: './.env.production'
          remote_path: ${{ secrets.HOSTINGER_DEPLOY_PATH || '/public_html' }}
          delete: 'false'
        continue-on-error: true

      # 9. Deploy .htaccess (configuração Apache para SPA)
      - name: Deploy .htaccess para Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          local_path: './.htaccess'
          remote_path: ${{ secrets.HOSTINGER_DEPLOY_PATH || '/public_html' }}
          delete: 'false'
        continue-on-error: true

      # 10. SSH para verificar deploy (opcional)
      - name: Verificar deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          script: |
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH || '/public_html' }}
            echo "✅ Deploy concluído em: $(date)"
            echo "📦 Arquivos no servidor:"
            ls -lah | head -10
            echo "---"
            echo "🔍 Verificando index.html:"
            ls -lah index.html
        continue-on-error: true

      # 11. Notificação de sucesso
      - name: ✅ Deploy bem-sucedido!
        if: success()
        run: |
          echo "🚀 LUMI foi atualizado com sucesso!"
          echo "📍 Verifique em: https://${{ secrets.HOSTINGER_DOMAIN }}"

      # 12. Notificação de erro
      - name: ❌ Erro no deploy
        if: failure()
        run: |
          echo "⚠️ Houve um erro durante o deploy."
          echo "🔗 Verifique os logs acima e as configurações de secrets."
